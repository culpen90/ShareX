name: Build ShareX

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "**/.gitignore"
      - "**/.gitattributes"

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Package app
        run: |
          app_path="$(CONFIGURATION=release ./ShareX/Scripts/package-macos-app.sh)"
          ditto -c -k --norsrc --keepParent "$app_path" ShareX-macOS.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShareX-macOS
          path: ShareX-macOS.zip
